
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glee Club ♡</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- CSS INSIDE HTML -->
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fff0f0, #fff9ef, #fff0bd);
            color: #a95779;
            min-height: 100vh;
        }

        .navbar {
            background-color: #fff0ae;
            border-bottom: 5px solid #ffe4bd;
        }

        .navbar-brand, .nav-link {
            color: #ed7195 !important;
            font-weight: 800;
        }

        .hero {
            text-align: center;
            padding: 55px 15px 25px;
        }

        .hero h1 {
            color: #ed7195;
            font-size: 4rem;
            font-weight: 800;
            text-shadow: 2px 3px #ffd4dc;
        }

        .tagline {
            color: #ed7195;
            letter-spacing: 3px;
            font-weight: 800;
        }

        .member-card {
            background-color: #fffdf8;
            border: 2px solid #ffdc91;
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 9px #f8e5c8;
            max-width: 510px;
            margin: 0 auto 50px;
        }

        .member-card h2 {
            color: #ed7195;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .form-control {
            background-color: #fffaf1;
            border: 2px solid #ffdc91;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 15px;
            color: #a95779;
        }

        .form-control:focus {
            border-color: #ed8cab;
            box-shadow: 0 0 0 3px #ffe0e8;
        }

        .btn-pink {
            background-color: #f783a2;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 13px 38px;
            font-weight: 800;
            box-shadow: 0 5px #df6687;
        }

        .btn-pink:hover {
            background-color: #ed7195;
            color: white;
        }

        #output {
            background-color: #fff0f3;
            border: 2px dashed #ffadc1;
            border-radius: 20px;
            padding: 20px;
            margin-top: 25px;
            color: #a95779;
            overflow-wrap: anywhere;
        }

        @media (max-width: 576px) {
            .hero h1 {
                font-size: 3rem;
            }

            .member-card {
                padding: 24px;
                margin: 0 15px 40px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand">
        <div class="container">
            <a class="navbar-brand fs-4" href="#home">♫ Glee Club ♡</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#home">Home</a>
                <a class="nav-link" href="#about">About</a>
                <a class="nav-link" href="#members">Members</a>
            </div>
        </div>
    </nav>

    <!-- Heading -->
    <section class="hero" id="home">
        <div style="font-size: 2.5rem; color: #f783a2;">♫ ♪ ♡</div>
        <h1>Glee Club</h1>
        <p class="tagline">SING ✧ SUPPORT ✧ BELONG</p>
        <p class="mt-4 mb-1">Every voice matters! 🎤</p>
        <p>Add a new member to our Glee Club!</p>
    </section>

    <!-- Member Manager -->
    <section class="member-card" id="members">
        <div class="text-center mb-4">
            <h2>🎀 Member Manager</h2>
            <p class="mt-3 mb-0">Enter a member's name below to add them.</p>
        </div>

        <input type="text" class="form-control"
               id="first" placeholder="Enter your first name">

        <input type="text" class="form-control"
               id="last" placeholder="Enter your last name">

        <div class="text-center">
            <button type="button" class="btn btn-pink mt-2"
                    py-click="add_members">
                ♫ Add Member
            </button>
        </div>

        <div id="output">
            <div class="text-center">
                <div style="font-size: 1.7rem; color: #ed7195;">♫</div>
                Your member list will appear here... ♡
            </div>
        </div>
    </section>

   <py-script src="main.py"></py-script>

</body>
</html>
